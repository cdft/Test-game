name: Publish the game to GitHub Pages

# The game is plain static files, so Pages can serve the repository as-is.
#
# Turning Pages ON for the first time needs repository-admin rights that the
# Actions token does not have, so this workflow cannot switch it on by itself.
# The `check` job asks the API whether Pages is configured for Actions, and the
# `deploy` job is skipped entirely until it is — a skipped job passes, so the
# check stays green, and publishing starts on the next push once you set:
#
#   Settings -> Pages -> Build and deployment -> Source: GitHub Actions
#
# The deploy job is kept separate because its `github-pages` environment only
# exists once Pages is enabled; referencing it before that fails the job before
# any step can run.

on:
  push:
    branches:
      - main
      - claude/cats-dogs-game-prototype-gyzlsr
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys race; let an in-flight one finish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.probe.outputs.ready }}
    steps:
      - id: probe
        name: Is Pages configured to build from Actions?
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          build_type=$(gh api "repos/$GITHUB_REPOSITORY/pages" --jq .build_type 2>/dev/null || echo "")
          if [ "$build_type" = "workflow" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
            echo "::notice title=Pages ready::Publishing the game."
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Pages not enabled::Set Settings -> Pages -> Source to 'GitHub Actions'; the next push will publish the game. Skipping deploy."
          fi

  deploy:
    needs: check
    if: needs.check.outputs.ready == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - id: deployment
        uses: actions/deploy-pages@v4
